name: Publish UAT APK

# After Android CI passes on main, build a signed uatRelease APK ("SWISRA UAT", UAT backend) from the
# commit CI tested and publish it as a GitHub pre-release, for testers to install. A merge that
# breaks CI never produces an APK. It is the app's counterpart of the backend's publish-image.yml.
# workflow_run only runs the version of this file on main, so it can't be tried on a PR.
on:
  workflow_run:
    workflows: [Android CI]
    types: [completed]
    branches: [main]

# Two quick merges publish one after the other, in order
concurrency:
  group: publish-uat-apk

# How many UAT pre-releases to keep; older ones (and their uat-* tags) are deleted
env:
  KEEP_UAT_RELEASES: 10

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    # Creating releases and tags needs write access to the repo contents
    permissions:
      contents: write

    steps:
      # Full history: the versionCode is the number of commits on main, the name starts from the last v* tag
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Commits on main only go up, and tag builds (release.yml) count the same way, so a newer
      # build always installs over an older one
      - name: Version
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          count=$(git rev-list --count HEAD)
          base=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          name="${base:-0.0.0}-uat.${count}+${SHA::7}"
          echo "code=$count" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=uat-$count" >> "$GITHUB_OUTPUT"

      # An empty URL or a missing key would still build (with no backend, or unsigned), so stop here instead
      - name: Backend URL and signing key
        env:
          API_UAT_URL: ${{ vars.API_UAT_URL }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$API_UAT_URL" ]; then echo "::error::Set the API_UAT_URL repository variable"; exit 1; fi
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "api.uatUrl=$API_UAT_URL" > local.properties
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed uatRelease APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleUatRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
          apk=$(ls app/build/outputs/apk/uat/release/*.apk | head -1)
          case "$apk" in *-unsigned.apk) echo "::error::The APK is unsigned; check the signing secrets"; exit 1;; esac
          mkdir -p dist
          cp "$apk" "dist/swisra-uat-${{ steps.version.outputs.name }}.apk"

      # R8 renames classes; this file turns a tester's crash stack trace back into readable names
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.tag }}
          path: app/build/outputs/mapping/uatRelease/mapping.txt
          if-no-files-found: ignore

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          # A rerun of the same commit replaces the APK instead of failing
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            {
              echo "UAT build of \`${SHA::7}\`: $(git log -1 --format=%s "$SHA")"
              echo
              echo "Installs as **SWISRA UAT** next to the real app and talks to the UAT backend."
              echo "On the phone: download the APK below and open it (allow installs from your browser if asked)."
            } > notes.md
            gh release create "$TAG" dist/*.apk \
              --prerelease \
              --target "$SHA" \
              --title "UAT build ${{ steps.version.outputs.code }} ($NAME)" \
              --notes-file notes.md
          fi

      - name: Delete old UAT pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"uat-\")))] | sort_by(.createdAt) | reverse | .[${KEEP_UAT_RELEASES}:] | .[].tagName" \
            | while read -r old; do
                gh release delete "$old" --yes --cleanup-tag
              done

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          {
            echo "### Published UAT APK \`$NAME\`"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
