name: Release

# Pushing a v* tag (e.g. v0.2.0) on main builds the signed prod app: the AAB to upload to the
# Play Console and an APK to install directly. It publishes both as a GitHub Release, with the
# notes taken from that version's CHANGELOG section. See docs/GITHUB_REPO_SETUP.md §10.2.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Full history: checking the tag is on main, and the versionCode (commits on main)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only release what was merged (and so passed CI), and only versions the changelog describes
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main; tag a commit of main"; exit 1
          fi
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # An empty URL or a missing key would still build (with no backend, or unsigned), so stop here instead
      - name: Backend URL and signing key
        env:
          API_PROD_URL: ${{ vars.API_PROD_URL }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$API_PROD_URL" ]; then echo "::error::Set the API_PROD_URL repository variable"; exit 1; fi
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "api.prodUrl=$API_PROD_URL" > local.properties
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed prodRelease AAB and APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew bundleProdRelease assembleProdRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName="$NAME"
          apk=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          case "$apk" in *-unsigned.apk) echo "::error::The APK is unsigned; check the signing secrets"; exit 1;; esac
          mkdir -p dist
          cp app/build/outputs/bundle/prodRelease/*.aab "dist/swisra-$NAME.aab"
          cp "$apk" "dist/swisra-$NAME.apk"
          # Upload it to the Play Console with the AAB, so its crash reports are readable
          cp app/build/outputs/mapping/prodRelease/mapping.txt "dist/mapping-$NAME.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Released $TAG"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
            echo
            echo "Upload \`swisra-${TAG#v}.aab\` (and its mapping file) to the Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
